services:
  pathscope:
    image: pathscope:local
    build: .
    container_name: pathscope-monitor
    environment:
      PATHSCOPE_CONFIG: /host-config/config.yaml
    cap_add:
      - NET_RAW      # required by mtr for ICMP/UDP probing
      - NET_ADMIN
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: .
        target: /host-config
    ports:
      - "8000:8000"
    restart: unless-stopped
